server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker DNS is resolved at request time so Nginx can start even when
        # the API container is still being created or restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://webar-api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:wasm|dll|dat|json|js|css|png|ico|onnx)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
}
