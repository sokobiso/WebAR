services:
  webar-api:
    container_name: webar-api
    build:
      context: ./WebAR.API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"
    restart: unless-stopped

  webar-client:
    container_name: webar-client
    build:
      context: ./WebAR.Client
      dockerfile: Dockerfile
    depends_on:
      - webar-api
    ports:
      - "8080:8080"
    restart: unless-stopped
